[workspace]
members = ["crates/core", "crates/protocol", "crates/transfer", "crates/server", "crates/client", "crates/cli", "crates/codex-adapter", "crates/test-support", "apps/desktop/src-tauri"]
default-members = ["crates/core", "crates/protocol", "crates/transfer", "crates/server", "crates/client", "crates/cli", "crates/codex-adapter", "crates/test-support"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", features = ["sink"] }
nix = { version = "0.31", features = ["signal", "process", "fs", "user", "term"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "2.0.1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "io-std", "macros", "net", "process", "rt-multi-thread", "sync", "time", "signal"] }
tokio-tungstenite = "0.28"
url = "2.5.8"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
security-framework = "3"
zeroize = "1"
toml = "1.1.2"

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
