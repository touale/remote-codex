name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  execution-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.changelog.outputs.version }}
      notes: ${{ steps.changelog.outputs.content }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Calculate release version and notes
        id: changelog
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4
        with:
          version: v2.14.1
          args: --bump --unreleased
        env:
          OUTPUT: ${{ runner.temp }}/release-notes.md
      - name: Check release tag
        env:
          RELEASE_VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            echo "::error::No unreleased changes since $RELEASE_VERSION."
            exit 1
          fi
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
      - name: Set release version
        env:
          RELEASE_VERSION: ${{ steps.changelog.outputs.version }}
        run: python3 .github/scripts/release-version.py "$RELEASE_VERSION"
      - name: Build Linux execution service
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked -p remote-codex-server --target x86_64-unknown-linux-musl
      - name: Share Linux execution service
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: execution-service
          path: target/x86_64-unknown-linux-musl/release/remote-codex-server
          if-no-files-found: error

  release:
    needs: execution-service
    runs-on: macos-14
    environment: release-acceptance
    timeout-minutes: 30
    env:
      REMOTE_CODEX_SERVER_ARTIFACT: ${{ github.workspace }}/target/execution-service/remote-codex-server
      RELEASE_VERSION: ${{ needs.execution-service.outputs.version }}
      REMOTE_CODEX_RELEASE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
      - run: cargo fetch --locked
      - name: Install Node and cache npm dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Set release version
        run: python3 .github/scripts/release-version.py "$RELEASE_VERSION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: execution-service
          path: target/execution-service
      - run: npm ci --prefix apps/desktop
      - name: Build CLI
        run: cargo build --release --locked -p remote-codex
      - name: Package and verify desktop release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo '::error::Configure TAURI_SIGNING_PRIVATE_KEY before publishing updates.'; exit 1; }
          export APPLE_SIGNING_IDENTITY="${APPLE_SIGNING_IDENTITY:--}"
          python3 - <<'PY' > "$RUNNER_TEMP/updater-config.json"
          import json, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          print(json.dumps({'bundle': {'createUpdaterArtifacts': True},
                            'plugins': {'updater': {'pubkey': (root / 'crates/client/src/updates/public.key').read_text().strip()}}}))
          PY
          npm --prefix apps/desktop run tauri -- build --bundles app,dmg --config "$RUNNER_TEMP/updater-config.json"
          codesign --verify --deep --strict 'target/release/bundle/macos/Remote Codex.app'
          for image in target/release/bundle/dmg/*.dmg; do hdiutil verify "$image"; done
          rm -rf target/release-artifacts
          mkdir -p target/release-artifacts
          COPYFILE_DISABLE=1 tar -czf target/release-artifacts/remote-codex-cli-macos-arm64.tar.gz -C target/release remote-codex
          npm --prefix apps/desktop run tauri -- signer sign "$GITHUB_WORKSPACE/target/release-artifacts/remote-codex-cli-macos-arm64.tar.gz"
          cp target/release/bundle/dmg/*.dmg target/release-artifacts/remote-codex-app-macos-arm64.dmg
          cp 'target/release/bundle/macos/Remote Codex.app.tar.gz' target/release-artifacts/remote-codex-app-macos-arm64.tar.gz
          cp 'target/release/bundle/macos/Remote Codex.app.tar.gz.sig' target/release-artifacts/remote-codex-app-macos-arm64.tar.gz.sig
          cd target/release-artifacts
          shasum -a 256 *.tar.gz *.dmg *.sig > SHA256SUMS
      - name: Upload release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remote-codex-macos-arm64
          path: target/release-artifacts/
          if-no-files-found: error

  publish:
    needs: [execution-service, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: remote-codex-macos-arm64
          path: target/release-artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.execution-service.outputs.version }}
          RELEASE_NOTES: ${{ needs.execution-service.outputs.notes }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes minisign
          base64 --decode crates/client/src/updates/public.key > "$RUNNER_TEMP/update-public.key"
          cd target/release-artifacts
          sha256sum --check SHA256SUMS
          for archive in *.tar.gz; do
            base64 --decode "$archive.sig" > "$RUNNER_TEMP/update.sig"
            minisign -Vm "$archive" -p "$RUNNER_TEMP/update-public.key" -x "$RUNNER_TEMP/update.sig"
          done
          release_url="https://github.com/$GH_REPO/releases/download/$RELEASE_VERSION"
          {
            printf '## Downloads\n\n'
            printf '| Platform | Desktop app | CLI |\n'
            printf '| --- | --- | --- |\n'
            printf '| macOS · Apple Silicon | [Download App](%s/remote-codex-app-macos-arm64.dmg) | [Download CLI](%s/remote-codex-cli-macos-arm64.tar.gz) |\n\n' "$release_url" "$release_url"
            cat <<'APP_HELP'
          **macOS: App won’t open?**

          Move **Remote Codex** to **Applications** first. If macOS blocks it, go to **System Settings → Privacy & Security → [Open Anyway](https://support.apple.com/en-us/102445)**.

          If you trust this download and it remains blocked, run:

          ```sh
          xattr -dr com.apple.quarantine "/Applications/Remote Codex.app"
          ```

          Then open the app again.

          APP_HELP
            printf '%s\n' "$RELEASE_NOTES"
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_VERSION" ./* --draft \
            --target "$GITHUB_SHA" --title "$RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_VERSION" --draft=false --latest
