name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
      - name: Build Linux execution service
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked -p remote-codex-server --target x86_64-unknown-linux-musl
      - name: Share Linux execution service
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: execution-service
          path: target/x86_64-unknown-linux-musl/release/remote-codex-server
          if-no-files-found: error

  release:
    needs: execution-service
    runs-on: macos-14
    environment: release-acceptance
    timeout-minutes: 30
    env:
      REMOTE_CODEX_SERVER_ARTIFACT: ${{ github.workspace }}/target/execution-service/remote-codex-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
      - run: cargo fetch --locked
      - name: Install Node and cache npm dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: execution-service
          path: target/execution-service
      - run: npm ci --prefix apps/desktop
      - name: Build CLI
        run: cargo build --release --locked -p remote-codex
      - name: Package and verify desktop release
        run: |
          export APPLE_SIGNING_IDENTITY="${APPLE_SIGNING_IDENTITY:--}"
          npm --prefix apps/desktop run tauri -- build --bundles app,dmg
          codesign --verify --deep --strict 'target/release/bundle/macos/Remote Codex.app'
          for image in target/release/bundle/dmg/*.dmg; do hdiutil verify "$image"; done
          mkdir -p target/release-artifacts
          tar -czf target/release-artifacts/remote-codex-macos-arm64.tar.gz -C target/release remote-codex
          cp target/release/bundle/dmg/*.dmg target/release-artifacts/remote-codex-macos-arm64.dmg
          cd target/release-artifacts
          shasum -a 256 *.tar.gz *.dmg > SHA256SUMS
      - name: Upload release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remote-codex-macos-arm64
          path: target/release-artifacts/
          if-no-files-found: error

  publish:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: remote-codex-macos-arm64
          path: target/release-artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(jq -er .version apps/desktop/src-tauri/tauri.conf.json)"
          cd target/release-artifacts
          sha256sum --check SHA256SUMS
          gh release create "$tag" ./* --target "$GITHUB_SHA" --title "$tag" --generate-notes
