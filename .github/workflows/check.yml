name: Check

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Run native and SSH release gates on the configured release runner
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Architecture boundaries and source size
        run: python3 tools/check_architecture.py
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Tests without model credentials
        run: cargo test --workspace --all-targets --locked --offline

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: [self-hosted, macOS, ARM64, remote-codex-release]
    environment: release-acceptance
    timeout-minutes: 30
    env:
      REMOTE_CODEX_NATIVE: ${{ vars.REMOTE_CODEX_NATIVE }}
      REMOTE_CODEX_SSH_TARGET: ${{ vars.REMOTE_CODEX_SSH_TARGET }}
      REMOTE_CODEX_SSH_PORT: ${{ vars.REMOTE_CODEX_SSH_PORT }}
      REMOTE_CODEX_SSH_IDENTITY: ${{ vars.REMOTE_CODEX_SSH_IDENTITY }}
      REMOTE_CODEX_SSH_CONFIG: ${{ vars.REMOTE_CODEX_SSH_CONFIG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: cargo fetch --locked
      - run: python3 tools/release.py
