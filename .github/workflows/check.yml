name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Architecture boundaries and source size
        run: python3 tests/architecture.py
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --exclude remote-codex-desktop --all-targets --locked --offline -- -D warnings
      - name: Tests without model credentials
        run: cargo test --workspace --exclude remote-codex-desktop --all-targets --locked --offline

      - name: Build Linux execution service
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked -p remote-codex-server --target x86_64-unknown-linux-musl
      - name: Share Linux execution service
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: execution-service
          path: target/x86_64-unknown-linux-musl/release/remote-codex-server
          if-no-files-found: error

  desktop:
    needs: rust
    env:
      REMOTE_CODEX_SERVER_ARTIFACT: ${{ github.workspace }}/target/execution-service/remote-codex-server
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
      - name: Install Node and cache npm dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: cargo fetch --locked
      - run: npm ci --prefix apps/desktop
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: execution-service
          path: target/execution-service
      - run: npm run check:frontend --prefix apps/desktop
      - run: cargo clippy -p remote-codex-desktop --all-targets --locked --offline -- -D warnings
      - name: Build isolated desktop E2E application
        run: |
          npm --prefix apps/desktop run build -- --mode e2e
          export TAURI_CONFIG="$(cat apps/desktop/src-tauri/tauri.e2e.conf.json)"
          cargo build -p remote-codex-desktop --locked --offline --features e2e,custom-protocol
      - run: npm --prefix apps/desktop run test:e2e
