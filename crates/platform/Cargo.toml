[package]
name = "remote-codex-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cap-std = "4.0.3"
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop", "creation-flags"] }
tokio.workspace = true

[lints]
workspace = true

[target."cfg(windows)".dependencies]
winapi-util = "0.1.11"
windows-permissions = "0.2.4"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
tempfile.workspace = true
